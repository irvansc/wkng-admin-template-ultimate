<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>419 Page Expired - Daily Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/core.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/error-pages.css">
</head>

<body class="error-page">

    <div class="bg-grid"></div>
    <div class="orb orb-1" id="orb1" style="background: #f1c40f;"></div>
    <div class="orb orb-2" id="orb2" style="background: #ff007f;"></div>

    <div class="content-box" id="contentBox">

        <div class="ghost-container" style="color: #f1c40f;">
            <i class="fa-solid fa-hourglass-end fa-beat-fade" style="--fa-animation-duration: 3s;"></i>
        </div>

        <div class="glitch-wrapper">
            <h1 class="error-code" data-text="419" style="text-shadow: 2px 2px 0px #f1c40f;">419</h1>
        </div>

        <h2 class="error-title">Page Expired</h2>
        <p class="error-desc">
            // Session Timeout: Sesi Anda telah berakhir karena tidak ada aktivitas.<br>
            // Action: Silakan muat ulang halaman untuk memperbarui token sesi.
        </p>

        <div class="justify-content-beetween align-items-center gap-3">
            <button onclick="window.location.reload()" class="btn btn-home rounded-pill mb-2"
                style="background: #f1c40f; color: #000;">
                <i class="fa-solid fa-arrows-rotate me-2"></i> Refresh Page
            </button>
            <a href="auth-login.html" class="btn btn-ghost rounded-pill">
                Login Again
            </a>
        </div>
    </div>

    <footer class="error-footer">
        &copy; 2025 DAILY ADMIN SYSTEM. ALL RIGHTS RESERVED.
    </footer>

    <script src="assets/js/error-pages.js"></script>
</body>

</html>
