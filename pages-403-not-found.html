<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Forbidden - Daily Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/core.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/error-pages.css">
</head>

<body class="error-page">

    <div class="bg-grid"></div>
    <div class="orb orb-1" id="orb1" style="background: #e74c3c;"></div>
    <div class="orb orb-2" id="orb2" style="background: #f1c40f;"></div>

    <div class="content-box" id="contentBox">

        <div class="ghost-container" style="color: #e74c3c;">
            <i class="fa-solid fa-shield-halved fa-shake" style="--fa-animation-duration: 2s;"></i>
        </div>

        <div class="glitch-wrapper">
            <h1 class="error-code" data-text="403" style="text-shadow: 2px 2px 0px #e74c3c;">403</h1>
        </div>

        <h2 class="error-title">Access Forbidden</h2>
        <p class="error-desc">
            // Warning: Anda tidak memiliki izin untuk mengakses area ini.<br>
            // Protocol: Hubungi Administrator jika ini adalah kesalahan.
        </p>

        <div class="justify-content-beetween align-items-center gap-3 ">
            <a href="dashboard.html" class="btn btn-home rounded-pill mb-2" style="background: #e74c3c; color: #fff;">
                <i class="fa-solid fa-house-lock me-2"></i> Dashboard
            </a>
            <a href="#" onclick="history.back()" class="btn btn-ghost rounded-pill">
                Go Back
            </a>
        </div>
    </div>
    <footer class="error-footer">
        &copy; 2025 DAILY ADMIN SYSTEM. ALL RIGHTS RESERVED.
    </footer>
    <script src="assets/js/error-pages.js"></script>
</body>

</html>
