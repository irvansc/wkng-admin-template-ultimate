<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - Daily Admin</title>

    <!-- External Libs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Modular CSS -->
    <link rel="stylesheet" href="assets/css/core.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/auth.css">

</head>

<body class="auth-body">

    <!-- FLOATING THEME TOGGLE -->
    <button class="theme-toggle-btn" id="themeToggle" style="position: fixed; top: 20px; right: 20px; z-index: 100;">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-code" style="color: var(--text-main);"></i>
                <span>daily.dev</span>
            </div>
            <h1 class="auth-title">Set New Password</h1>
            <p class="auth-subtitle">Your new password must be different from previously used passwords.</p>
        </div>

        <form action="auth-login.html">
            <!-- FIELD 1: NEW PASSWORD -->
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="relative">
                    <input type="password" class="form-control" id="passwordInput" placeholder="••••••••">
                    <i class="fa-regular fa-eye-slash absolute-center-y-right" id="togglePassword"></i>
                </div>
                <div class="text-xs text-muted mt-2">Must be at least 8 characters.</div>
            </div>

            <!-- FIELD 2: CONFIRM PASSWORD (UPDATED) -->
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="relative">
                    <input type="password" class="form-control" id="confirmInput" placeholder="••••••••">
                    <i class="fa-regular fa-eye-slash absolute-center-y-right" id="toggleConfirm"></i>
                </div>
            </div>

            <!-- Tombol Utama -->
            <button type="submit" class="btn btn-primary w-full"
                style="height: 48px; font-size: 16px; margin-top: 8px;">Reset Password</button>

            <!-- Tombol Kembali ke Login -->
            <a href="auth-login.html" class="btn btn-ghost w-full"
                style="height: 48px; font-size: 16px; margin-top: 12px; border-color: transparent;">
                <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Back to Login
            </a>
        </form>

    </div>

    <!-- Minimal JS for Theme Toggle & Password Toggle -->
    <script>
        const html = document.documentElement;
        const toggleBtn = document.getElementById('themeToggle');
        const icon = toggleBtn.querySelector('i');

        // Load Theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        toggleBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateIcon(next);
        });

        function updateIcon(theme) {
            icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        // --- PASSWORD TOGGLE LOGIC (GENERIC FUNCTION) ---
        function setupPasswordToggle(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);

            if (input && toggle) {
                toggle.addEventListener('click', function () {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);

                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        }

        // Init Toggle for Both Fields
        setupPasswordToggle('passwordInput', 'togglePassword');
        setupPasswordToggle('confirmInput', 'toggleConfirm');

    </script>
</body>

</html>
