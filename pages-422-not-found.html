<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>422 Unprocessable Entity - Daily Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/core.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/error-pages.css">
</head>

<body class="error-page">

    <div class="bg-grid"></div>
    <div class="orb orb-1" id="orb1" style="background: #ec4899;"></div>
    <div class="orb orb-2" id="orb2" style="background: #8b5cf6;"></div>

    <div class="content-box" id="contentBox">

        <div class="ghost-container" style="color: #ec4899;">
            <i class="fa-solid fa-file-circle-xmark fa-shake" style="--fa-animation-duration: 2s;"></i>
        </div>

        <div class="glitch-wrapper">
            <h1 class="error-code" data-text="422" style="text-shadow: 2px 2px 0px #ec4899;">422</h1>
        </div>

        <h2 class="error-title">Validation Failed</h2>
        <p class="error-desc">
            // Error: Data yang dikirim tidak dapat diproses (Unprocessable Entity).<br>
            // Action: Mohon periksa kembali input formulir Anda (format email, password, dll).
        </p>

        <div class="justify-content-beetween align-items-center gap-3">
            <button onclick="history.back()" class="btn btn-home rounded-pill mb-2"
                style="background: #ec4899; color: #fff;">
                <i class="fa-solid fa-pen-to-square me-2"></i> Fix Inputs
            </button>
            <a href="dashboard.html" class="btn btn-ghost rounded-pill">
                Cancel
            </a>
        </div>
    </div>

    <footer class="error-footer">
        &copy; 2025 DAILY ADMIN SYSTEM. ALL RIGHTS RESERVED.
    </footer>

    <script src="assets/js/error-pages.js"></script>
</body>

</html>
